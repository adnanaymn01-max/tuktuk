name: tuktuk
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  geolocator: ^14.0.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  url_launcher: ^6.3.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  google_maps_flutter: ^2.18.0
  crypto: ^3.0.7
  image_picker: ^1.2.3
  firebase_storage: ^13.4.6
  supabase_flutter: ^2.17.1
  firebase_messaging: ^16.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/tuktuk_search_reference.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/tuktuk_app_icon.png"
  min_sdk_android: 24